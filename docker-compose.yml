name: kosh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kosh
      POSTGRES_PASSWORD: kosh
      POSTGRES_DB: kosh
    # Port 5442 on the host so this never clashes with a local Postgres or
    # another project's compose stack.
    ports:
      - "127.0.0.1:5442:5432"
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosh -d kosh"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kafka API, single node. Clients on the host use localhost:19092.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Observability: docker compose --profile obs up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs", "stack"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs", "stack"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kosh}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kosh.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3002:3000"

  # The whole system in containers: docker compose --profile stack up -d --build
  # The lab runs every Kosh process inside one container so it can kill them.
  lab:
    build: .
    image: kosh:latest
    profiles: ["stack"]
    command: ["lab"]
    environment:
      KOSH_DATABASE_URL: postgres://kosh:kosh@postgres:5432/kosh_lab?sslmode=disable
      KOSH_KAFKA_BROKERS: redpanda:9092
      LAB_DATA: /data
      LAB_TRAFFIC: "5"
    volumes:
      - labdata:/data
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports:
      - "127.0.0.1:8095:8095"

  dashboard:
    build: ./dashboard
    profiles: ["stack"]
    depends_on: [lab]
    ports:
      - "127.0.0.1:3005:3005"

volumes:
  pgdata:
  labdata:
