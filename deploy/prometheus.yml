# Scrapes every Kosh binary. Each job lists two targets: the lab container
# (when the stack runs in compose, where the lab runs every process) and
# host.docker.internal (when the binaries run on the host). Whichever is not
# running shows as down and is harmless.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["lab:8090", "host.docker.internal:8090"]
  - job_name: relay
    static_configs:
      - targets: ["lab:9101", "host.docker.internal:9101"]
  - job_name: dispatcher
    static_configs:
      - targets: ["lab:9102", "host.docker.internal:9102"]
  - job_name: worker
    static_configs:
      - targets: ["lab:9103", "host.docker.internal:9103"]
  - job_name: lab
    static_configs:
      - targets: ["lab:9104", "host.docker.internal:9104"]
