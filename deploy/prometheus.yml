# Scrapes every Kosh binary. Each job lists two targets: the container name
# (when the whole stack runs in compose) and host.docker.internal (when the
# binaries run on the host with `go run`). Whichever is not running shows as
# down and is harmless.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8090", "host.docker.internal:8090"]
  - job_name: relay
    static_configs:
      - targets: ["relay:9101", "host.docker.internal:9101"]
  - job_name: dispatcher
    static_configs:
      - targets: ["dispatcher:9102", "host.docker.internal:9102"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9103", "host.docker.internal:9103"]
  - job_name: lab
    static_configs:
      - targets: ["lab:9104", "host.docker.internal:9104"]
