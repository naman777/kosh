# Kosh on a VM that already runs other apps behind Foreman's Caddy (operator-prod).
#
#   docker compose -p kosh -f deploy/compose.shared.yml up -d
#
# Rules this file keeps so the neighbours are never disturbed:
#   - No host ports at all. Foreman's Caddy owns 80/443 and reaches Kosh over
#     its network, where only kosh-dashboard and kosh-grafana join.
#   - Every service name starts with "kosh-": Compose registers service names
#     as DNS on every network a service joins, and Foreman's Caddy already
#     proxies to plain names like "dashboard".
#   - Hard CPU and memory caps on every container (2 vCPUs are shared).
#   - Images are built elsewhere and loaded, never built on this host.
name: kosh

services:
  kosh-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosh
      POSTGRES_PASSWORD: kosh
      POSTGRES_DB: kosh
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosh -d kosh"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "0.40", memory: 512M }

  kosh-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=384M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    networks:
      default:
        aliases: [redpanda]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "0.40", memory: 640M }

  kosh-lab:
    image: kosh:latest
    restart: unless-stopped
    command: ["lab"]
    environment:
      KOSH_DATABASE_URL: postgres://kosh:kosh@postgres:5432/kosh_lab?sslmode=disable
      KOSH_KAFKA_BROKERS: redpanda:9092
      LAB_DATA: /data
      LAB_TRAFFIC: "1"
    volumes:
      - labdata:/data
    networks:
      default:
        aliases: [lab]
    depends_on:
      kosh-postgres: { condition: service_healthy }
      kosh-redpanda: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.60", memory: 512M }

  kosh-dashboard:
    image: kosh-dashboard:latest
    restart: unless-stopped
    depends_on: [kosh-lab]
    networks:
      default: {}
      foreman:
        aliases: [kosh-dashboard]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  kosh-prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      default:
        aliases: [prometheus]
    deploy:
      resources:
        limits: { cpus: "0.15", memory: 256M }

  kosh-grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kosh}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kosh.json
      GF_SERVER_ROOT_URL: https://kosh.namankundra.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      default: {}
      foreman:
        aliases: [kosh-grafana]
    deploy:
      resources:
        limits: { cpus: "0.15", memory: 256M }

networks:
  default: {}
  foreman:
    external: true
    name: foreman-production_default

volumes:
  pgdata:
  labdata:
